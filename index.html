<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#26251f"><link rel="manifest" href="manifest.webmanifest"><title>Ma Cave & Mes Fromages</title><style>body{font-family:system-ui;background:#f8f5ee;color:#28251f;margin:0}header{background:#29271f;color:white;padding:22px;text-align:center}main{max-width:620px;margin:auto;padding:18px}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:13px;cursor:pointer}.primary{background:#333e30;color:white;width:100%;font-weight:bold}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1;background:#e8e2d6}.tabs .active{background:#343e31;color:white}.card{background:white;border-radius:16px;padding:13px;margin:10px 0;display:flex;gap:12px;align-items:center;box-shadow:0 2px 9px #0001}.card img{width:85px;height:85px;object-fit:cover;border-radius:10px}.dot{width:33px;height:33px;border-radius:50%;border:3px solid transparent}.dot.selected{outline:3px solid #222;outline-offset:2px}.ratings{display:flex;justify-content:space-between;margin:18px 0}.hidden{display:none}input[type=text],select{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:10px}#preview{max-height:200px;max-width:100%;object-fit:contain;border-radius:12px}.muted{color:#777;font-size:13px}h2{font-size:19px} .top{display:flex;justify-content:space-between;align-items:center}</style></head><body><header><h1>🍷 Ma Cave & Mes Fromages 🧀</h1><div>Mes découvertes, mes coups de cœur</div></header><main><section id="home"><button class="primary" onclick="newEntry()">📷 Ajouter une découverte</button><div class="tabs"><button id="tab-all" onclick="setFilter('all')">Tout</button><button id="tab-vin" onclick="setFilter('vin')">🍷 Vins</button><button id="tab-fromage" onclick="setFilter('fromage')">🧀 Fromages</button><button id="tab-exception" onclick="setFilter('exception')">💜 Exceptionnels</button></div><input type="text" id="search" placeholder="🔎 Rechercher un produit" oninput="render()"><div id="entries"></div><button onclick="exportData()">⬇️ Sauvegarder mes données</button> <label style="display:inline-block;background:#e8e2d6;padding:12px;border-radius:12px;cursor:pointer">⬆️ Restaurer<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></section><section id="editor" class="hidden"><div class="top"><h2 id="editorTitle">Nouvelle découverte</h2><button onclick="showHome()">✕</button></div><label>Catégorie<select id="category"><option value="vin">🍷 Vin</option><option value="fromage">🧀 Fromage</option></select></label><label>Photo du produit<input id="photo" type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)"></label><p><img id="preview" class="hidden" alt="Photo du produit"></p><label>Nom du produit<input id="name" type="text" placeholder="Nom sur l'étiquette"></label><p class="muted">La photo est conservée. La reconnaissance automatique par IA nécessitera une connexion sécurisée à un service de reconnaissance ; cette V1 propose la saisie du nom.</p><strong>Mon appréciation</strong><div class="ratings" id="ratings"></div><p id="ratingName"></p><button class="primary" onclick="saveEntry()">✓ Enregistrer</button><p><button id="delete" class="hidden" onclick="deleteEntry()">🗑️ Supprimer</button></p></section></main><script>
const colors=['#d94c4c','#ed9937','#e7c94c','#4da36c','#9870cb'],labels=['Décevant','Moyen','Bon','Très bon','Exceptionnel'];let items=JSON.parse(localStorage.getItem('cave_fromages_v1')||'[]'),filter='all',editing=null,photoData='',rating=3;
function persist(){try{localStorage.setItem('cave_fromages_v1',JSON.stringify(items));return true}catch(e){alert('Espace de stockage insuffisant. Sauvegardez vos données et réduisez la taille des photos.');return false}}
function setFilter(f){filter=f;render()}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+filter));const q=document.getElementById('search').value.toLocaleLowerCase();let list=items.filter(x=>(filter==='all'||x.category===filter||(filter==='exception'&&x.rating===4))&&x.name.toLocaleLowerCase().includes(q));let el=document.getElementById('entries');el.replaceChildren();if(!list.length){el.textContent='Aucun produit pour le moment.';return}list.sort((a,b)=>b.created.localeCompare(a.created)).forEach(x=>{let card=document.createElement('div');card.className='card';card.onclick=()=>editEntry(x.id);if(x.photo){let img=document.createElement('img');img.src=x.photo;card.append(img)}let d=document.createElement('div');d.style.flex='1';let strong=document.createElement('strong');strong.textContent=x.name;let sub=document.createElement('div');sub.className='muted';sub.textContent=(x.category==='vin'?'🍷 Vin':'🧀 Fromage')+' · '+new Date(x.created).toLocaleDateString('fr-FR');d.append(strong,sub);let b=document.createElement('span');b.className='dot';b.style.background=colors[x.rating];b.title=labels[x.rating];card.append(d,b);el.append(card)})}
function showHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('editor').classList.add('hidden');render()}
function newEntry(){editing=null;photoData='';rating=3;document.getElementById('editorTitle').textContent='Nouvelle découverte';document.getElementById('category').value='vin';document.getElementById('name').value='';document.getElementById('photo').value='';document.getElementById('preview').classList.add('hidden');document.getElementById('delete').classList.add('hidden');showEditor()}
function editEntry(id){let x=items.find(x=>x.id===id);if(!x)return;editing=id;photoData=x.photo||'';rating=x.rating;document.getElementById('editorTitle').textContent='Modifier ma découverte';document.getElementById('category').value=x.category;document.getElementById('name').value=x.name;document.getElementById('photo').value='';document.getElementById('delete').classList.remove('hidden');showEditor()}
function showEditor(){document.getElementById('home').classList.add('hidden');document.getElementById('editor').classList.remove('hidden');updatePreview();renderRatings()}
function updatePreview(){let p=document.getElementById('preview');p.classList.toggle('hidden',!photoData);if(photoData)p.src=photoData}
function loadPhoto(e){let f=e.target.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let scale=Math.min(1,900/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photoData=canvas.toDataURL('image/jpeg',.68);URL.revokeObjectURL(url);updatePreview()};img.src=url}
function renderRatings(){let el=document.getElementById('ratings');el.replaceChildren();colors.forEach((c,i)=>{let b=document.createElement('button');b.className='dot'+(i===rating?' selected':'');b.style.background=c;b.title=labels[i];b.setAttribute('aria-label',labels[i]);b.onclick=()=>{rating=i;renderRatings()};el.append(b)});document.getElementById('ratingName').textContent=labels[rating]}
function saveEntry(){let name=document.getElementById('name').value.trim();if(!name){alert('Indiquez le nom du produit.');return}let old=items.find(x=>x.id===editing);let x={id:editing||String(Date.now())+Math.random(),name,category:document.getElementById('category').value,rating,photo:photoData,created:old?.created||new Date().toISOString()};let backup=items.slice();items=editing?items.map(y=>y.id===editing?x:y):[...items,x];if(!persist()){items=backup;return}showHome()}
function deleteEntry(){if(!confirm('Supprimer cette découverte ?'))return;items=items.filter(x=>x.id!==editing);persist();showHome()}
function exportData(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ma-cave-et-mes-fromages.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data)||!data.every(x=>x.id&&typeof x.name==='string'&&['vin','fromage'].includes(x.category)&&Number.isInteger(x.rating)&&x.rating>=0&&x.rating<=4))throw Error();if(!confirm('Remplacer la bibliothèque actuelle par cette sauvegarde ?'))return;let backup=items;items=data;if(!persist())items=backup;render()}catch(e){alert('Fichier de sauvegarde non valide.')}};reader.readAsText(f)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
